[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uno-reverse-email-agent"
version = "0.1.0.dev0"
description = "Local-first reverse-pitch workflow prototype"
requires-python = ">=3.11"

[project.scripts]
ure = "uno_reverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uno_reverse = ["static/*"]
